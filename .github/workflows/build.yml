name: Build & test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the feature band (rollForward: latestFeature), so any
          # 10.0.1xx patch this action installs satisfies it.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PosDesktop.slnx

      - name: Build
        # Analyzers + warnings-as-errors (Directory.Build.props) run here, on every OS —
        # this is the first line of defense against anything platform-specific.
        run: dotnet build PosDesktop.slnx --no-restore --configuration Release

      - name: Test
        # Headless UI tests (HeadlessUiTests.cs) run on every OS with no display server —
        # that's the point of Avalonia.Headless. Node is only needed if someone touches
        # tools/golden-fixtures and wants to regenerate the fixture locally; CI just
        # replays the committed JSON, no Node required here.
        run: dotnet test PosDesktop.slnx --no-build --configuration Release --logger "console;verbosity=normal"
