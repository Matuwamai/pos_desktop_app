name: Release

# Separate from build.yml (which keeps running build+test on every push/PR regardless
# of tags) — this only fires when a version tag is pushed, and produces installer
# packages per Phase 6's decision #5/#6. See the plan's "Explicitly out of scope"
# section: this workflow is the plumbing; actually pushing a real tag and publishing a
# public release is a separate, explicit decision, not something this file does on its
# own just by existing.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            channel: win-x64
            mainExe: Pos.Desktop.exe
          - rid: osx-arm64
            os: macos-latest
            channel: osx-arm64
            mainExe: Pos.Desktop
          - rid: linux-x64
            os: ubuntu-latest
            channel: linux-x64
            mainExe: Pos.Desktop
          - rid: linux-arm64
            os: ubuntu-latest
            channel: linux-arm64
            mainExe: Pos.Desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore PosDesktop.slnx

      - name: Publish (self-contained, ${{ matrix.rid }})
        run: >
          dotnet publish src/Pos.Desktop -r ${{ matrix.rid }} --self-contained
          -c Release -p:Version=${{ env.VERSION }} -o publish/${{ matrix.rid }}

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        shell: bash
        run: >
          vpk pack --packId PosDesktop --packVersion "${{ env.VERSION }}"
          --packDir publish/${{ matrix.rid }} --mainExe ${{ matrix.mainExe }}
          --packTitle "POS Terminal" --channel ${{ matrix.channel }}

      - name: Upload to GitHub Release
        shell: bash
        run: >
          vpk upload github --repoUrl https://github.com/Matuwamai/pos_desktop_app
          --token "${{ secrets.GITHUB_TOKEN }}" --channel ${{ matrix.channel }}
          --merge --publish
